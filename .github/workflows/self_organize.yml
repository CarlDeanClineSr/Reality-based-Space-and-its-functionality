name: Self-Organize LUFT Repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 07:00 UTC
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  organize:
    runs-on: ubuntu-latest
    # Prevent self-trigger loops from github-actions bot
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install googletrans==4.0.0rc1
          pip install pandas matplotlib basemap

      - name: Generate repo manifest
        run: python generate_repo_manifest.py

      - name: Auto-index repository
        run: python auto_index_repo.py

      - name: Slugify and rename notes
        run: python slugify_rename_notes.py

      - name: Update README with manifest stats (EN/FR/RU/JA)
        run: python update_readme_bilingual.py

      - name: Generate index diff log
        run: python index_diff_log.py

      - name: Create missing contributor map script
        run: |
          cat > generate_contributor_map.py << 'EOF'
          import os
          import pandas as pd
          
          # Simple placeholder contributor map generator
          def main():
              contributors = [
                  {"login": "CarlDeanClineSr", "name": "Dr. Carl Dean Cline Sr.", "lat": 40.7128, "lon": -74.0060},
                  {"login": "LUFT-AutoBot", "name": "LUFT Auto Organization Bot", "lat": 37.7749, "lon": -122.4194}
              ]
              
              df = pd.DataFrame(contributors)
              df.to_csv("contributors_map.csv", index=False)
              print("Generated contributors_map.csv")
          
          if __name__ == "__main__":
              main()
          EOF

      - name: Generate contributor map
        run: python generate_contributor_map.py

      - name: Generate contributor world map image
        run: python generate_contributor_map_image.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-update: LUFT repository organization"
          title: "🤖 Auto-update: LUFT Repository Organization"
          body: |
            ## 📊 Automated LUFT Repository Organization
            
            This PR contains automated updates to the LUFT repository organization:
            
            - ✅ **Manifest Generation**: Updated file manifests and statistics
            - ✅ **Index Updates**: Refreshed repository index with latest files
            - ✅ **Note Organization**: Converted and organized text documents
            - ✅ **README Updates**: Updated manifest stats in multiple languages
            - ✅ **Diff Logging**: Generated index change logs
            - ✅ **Contributor Mapping**: Updated contributor world map
            
            ### 🚀 How to manually trigger this workflow:
            1. Go to the **Actions** tab in the repository
            2. Select **Self-Organize LUFT Repo** workflow
            3. Click **Run workflow** button
            4. Choose the branch and click **Run workflow**
            
            This automated process helps keep the LUFT repository organized and up-to-date with the latest research files and documentation.
            
            ---
            *Generated by LUFT-AutoBot 🤖*
          branch: luft/auto-organize
          branch-suffix: timestamp
          delete-branch: true
          draft: true
