name: LUFT Auto Scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'luft_auto_scan.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-scan:
    runs-on: ubuntu-latest
    # Prevent self-trigger loops from github-actions bot
    if: ${{ github.actor != 'github-actions[bot]' }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install numpy scipy matplotlib
      - name: Run LUFT Auto Scan
        run: python luft_auto_scan.py
      - name: Create Pull Request with scan results
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update LUFT anomaly scan results [auto]"
          title: "🔬 LUFT Auto Scan Results Update"
          body: |
            ## 🔬 LUFT Anomaly Scan Results
            
            This PR contains automated updates from the LUFT auto-scan process:
            
            - ✅ **Anomaly Detection**: Latest scan results from LUFT data analysis
            - ✅ **Findings Report**: Updated LUFT_Findings.md with new discoveries
            - ✅ **Data Export**: Updated LUFT_Findings.csv with structured results
            
            ### 🚀 Manually triggered by:
            - Data changes in the `data/` directory
            - Updates to `luft_auto_scan.py`
            - Manual workflow dispatch
            
            Review the findings and merge when ready.
            
            ---
            *Generated by LUFT Auto Scan 🤖*
          branch: luft/auto-scan-results
          branch-suffix: timestamp
          delete-branch: true
